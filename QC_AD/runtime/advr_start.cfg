// Restore the base VR controller layout after AD and saved desktop bindings.
exec vr_bindings.cfg
// Weapons are selected with hands and holsters; B remains menu Back.
unbind BBUTTON
advr_defaults
// AD owns map startup. Do not enter the QuakeVR-only hub/calibration maps.
vr_setup_pending 0
vr_enabled 1
maxplayers 1
deathmatch 0
coop 0
map start
