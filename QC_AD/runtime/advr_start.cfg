// Restore the base VR controller layout after AD and saved desktop bindings.
exec vr_bindings.cfg
// Weapons are selected with hands and holsters. Manual reload handles B/Y directly
// as per-hand ejection, so neither button needs a console binding. B remains menu Back.
unbind BBUTTON
// Leave gameplay D-pad and the left secondary button available for future binds.
// Menu navigation is handled separately by the engine.
unbind YBUTTON
unbind DPAD_UP
unbind DPAD_DOWN
unbind DPAD_LEFT
unbind DPAD_RIGHT
advr_defaults
// Matte VR weapons: omit the reflective room overlay.
vr_weapon_reflections 0
vr_weapon_reflections_strength 0
// AD owns map startup. Do not enter the QuakeVR-only hub/calibration maps.
vr_setup_pending 0
vr_enabled 1
maxplayers 1
deathmatch 0
coop 0
map start
